name: Bounded safety interleavings
on:
  pull_request:
    paths:
      - 'formal/safety-interleavings/**'
      - 'server/platform.rs'
      - '.github/workflows/bounded-safety-interleavings.yml'
  push:
    branches: [main]
    paths:
      - 'formal/safety-interleavings/**'
      - 'server/platform.rs'
      - '.github/workflows/bounded-safety-interleavings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact model bytes and execute positive and mutation checks
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -L formal
          test ! -L formal/safety-interleavings
          test ! -L formal/safety-interleavings/check.rs
          test -f formal/safety-interleavings/check.rs
          expected_blob="$(git rev-parse "HEAD:formal/safety-interleavings/check.rs")"
          test "$(git hash-object --no-filters formal/safety-interleavings/check.rs)" = "$expected_blob"
          mkdir -p tmp/formal-safety
          rustc --version
          rustc --edition=2021 --test -D warnings formal/safety-interleavings/check.rs -o tmp/formal-safety/check
          tmp/formal-safety/check --nocapture --test-threads=1
  source-format:
    needs: finite-model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check Rust formatting at the exact source head without private dependencies
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          rustfmt --version
          cargo fmt --all -- --check
  runtime-refinement:
    needs: finite-model
    # Never grant repository secrets to forked pull-request source trees.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure scoped read-only dependency access
        shell: bash
        env:
          VERIFICATION_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERIFICATION_READ_TOKEN:-}" ]]; then
            echo "BLOCKED: FLEET_GITHUB_READ_TOKEN not configured; cannot run production Cargo tests against pinned private dependencies" >&2
            exit 1
          fi
          echo "::add-mask::$VERIFICATION_READ_TOKEN"
          umask 077
          token_file="$(mktemp "$RUNNER_TEMP/formal-dependency-token.XXXXXX")"
          askpass_file="$(mktemp "$RUNNER_TEMP/formal-git-askpass.XXXXXX")"
          printf '%s' "$VERIFICATION_READ_TOKEN" > "$token_file"
          cat > "$askpass_file" <<'EOS'
          #!/bin/sh
          set -eu
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) cat "$FORMAL_TOKEN_FILE" ;;
            *) exit 1 ;;
          esac
          EOS
          chmod 700 "$askpass_file"
          {
            echo "FORMAL_TOKEN_FILE=$token_file"
            echo "GIT_ASKPASS=$askpass_file"
            echo "GIT_TERMINAL_PROMPT=0"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"
      - name: Execute production concurrent rate-limit refinement at the exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cargo --version
          cargo test --features server --lib server::platform::tests:: -- --nocapture
      - name: Scrub scoped dependency credentials
        if: always()
        shell: bash
        run: |
          rm -f "${FORMAL_TOKEN_FILE:-}" "${GIT_ASKPASS:-}"
