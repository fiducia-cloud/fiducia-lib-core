name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure read-only access to private fleet dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FLEET_GITHUB_TOKEN:-}" ]]; then
            echo 'FLEET_GITHUB_READ_TOKEN is required to verify private immutable dependencies.' >&2
            exit 1
          fi
          echo "::add-mask::$FLEET_GITHUB_TOKEN"
          git config --global \
            url."https://x-access-token:${FLEET_GITHUB_TOKEN}@github.com/".insteadOf \
            'https://github.com/'
          git ls-remote \
            https://github.com/ores-rate-limit/ores-rl-lib-core.git \
            31df606d26280611e2d2d684328a804644eb4255 \
            | grep -F 31df606d26280611e2d2d684328a804644eb4255

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy for every feature and target
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests for every feature and target
        run: cargo test --all-targets --all-features

      - name: Remove private dependency credentials
        if: always()
        shell: bash
        run: |
          git config --global --unset-all \
            'url.https://x-access-token:'"${FLEET_GITHUB_TOKEN:-}"'@github.com/.insteadof' || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Refuse committed credentials
        run: |
          set -euo pipefail
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)' -- . ':!.github/workflows/ci.yml'; then
            echo 'credential-like string committed' >&2
            exit 1
          fi

  zed-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install checksum-pinned zed CLI
        env:
          ZED_INSTALL_DIR: ${{ runner.temp }}/zed-bin
          ZED_VERSION: v0.3.0
          ZED_ASSET: zed-x86_64-unknown-linux-musl.tar.gz
          # Official v0.3.0 release asset: 11,170,187 bytes, published 2026-09-04.
          ZED_SHA256: e380240c96242ab3b29e0e9d14c95ba946d086f20f0732e34d0e5cf47513efc7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ZED_ASSET"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/zed-pkg/zed-cli/releases/download/$ZED_VERSION/$ZED_ASSET" -o "$archive"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'zed archive sha256=%s\n' "$actual_sha256"
          test "$actual_sha256" = "$ZED_SHA256"
          mkdir -p "$ZED_INSTALL_DIR"
          tar -xzf "$archive" -C "$ZED_INSTALL_DIR"
          test -x "$ZED_INSTALL_DIR/zed"
          "$ZED_INSTALL_DIR/zed" --version | grep -F '0.3.0'
          echo "$ZED_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Validate the manifest and the schema-v2 task plan
        run: |
          set -euo pipefail
          zed validate
          zed task list --all
          zed task graph check
          zed task --json run check --dry-run > /dev/null
