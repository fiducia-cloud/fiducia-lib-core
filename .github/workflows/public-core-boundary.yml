name: public-core-boundary

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/locks.rs'
      - '.github/workflows/public-core-boundary.yml'

permissions:
  contents: read

jobs:
  lock-facade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out raw PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert raw PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy
      - name: Format repository Rust
        run: cargo fmt --all -- --check
      - name: Verify public lock dependency stays non-recursive
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ores-locks-and-leases = { git = "https://github.com/ORESoftware/ores-locks-and-leases.git", rev = "e752dd983cfc5a5107396d1fb9ac192fa72270b1", default-features = false }' Cargo.toml
          ! grep -F 'features = ["fiducia"]' Cargo.toml
      - name: Build exact-source lock facade harness
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/fiducia-lock-facade"
          mkdir -p "$harness/src"
          cp src/locks.rs "$harness/src/lib.rs"
          cat > "$harness/Cargo.toml" <<'EOF'
          [package]
          name = "fiducia-lock-facade-boundary"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          ores-locks-and-leases = { git = "https://github.com/ORESoftware/ores-locks-and-leases.git", rev = "e752dd983cfc5a5107396d1fb9ac192fa72270b1", default-features = false }
          EOF
          cargo generate-lockfile --manifest-path "$harness/Cargo.toml"
          cargo clippy --locked --manifest-path "$harness/Cargo.toml" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$harness/Cargo.toml"

      # The repository's existing full CI remains the fail-closed gate for
      # private server adapters (ores-rl-lib-core, middleware, etc.). This lane
      # deliberately proves only the changed public lock facade without adding
      # credentials or weakening that private-dependency boundary.
