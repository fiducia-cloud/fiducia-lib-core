name: public-core-boundary

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/public-core-boundary.yml'

permissions:
  contents: read

jobs:
  public-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out raw PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert raw PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy
      - name: Verify public/default dependency graph
        run: cargo metadata --locked --no-deps >/dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check public core without private server adapters
        run: cargo check --locked --no-default-features
      - name: Test default public core
        run: cargo test --locked
