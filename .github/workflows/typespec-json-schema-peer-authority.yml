name: TypeSpec and JSON Schema Contract IR admission

on:
  pull_request:
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate negative-lane verifier syntax
        run: node --check test/fixtures/schema-authority-canary/check-stale-mapping-receipt.mjs
      - name: Verify repository-owned consumer policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("contract-admission/contract-ir-consumer.json", "utf8"));
          assert.equal(manifest.schema, "ores.contract-ir-consumer/v1");
          assert.equal(manifest.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.repositoryRole, "lib-core");
          assert.equal(manifest.canonicalAuthorityRepository, "fiducia-cloud/fiducia-interfaces");
          assert.equal(manifest.evidenceScope, "repository-local-canary-only");
          assert.equal(manifest.validator.repository, "ORESoftware/typespec-json-schema-validator");
          assert.equal(manifest.validator.actionCommit, "473224b714444c1af9b9cf535a79857c46b81318");
          assert.equal(manifest.validator.contractIrSchema, "ores.typespec-json-schema-validator.contract-ir/v1");
          assert.equal(manifest.authorityModel.precedence, "none");
          assert.equal(manifest.admission.allowFallbackAuthority, false);
          NODE
      - name: Compare peer authorities and emit fresh Contract IR
        uses: ORESoftware/typespec-json-schema-validator@473224b714444c1af9b9cf535a79857c46b81318
        with:
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/positive/report.json
          sarif: .typespec-json-schema-validator/positive/report.sarif
          contract_ir: .typespec-json-schema-validator/positive/contract-ir.json
          output_dir: .typespec-json-schema-validator/positive/generated
          max_probes: "64"
      - name: Verify positive current inputs, receipt, IR identity and complete scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@473224b714444c1af9b9cf535a79857c46b81318
        with:
          contract_ir: .typespec-json-schema-validator/positive/contract-ir.json
          report: .typespec-json-schema-validator/positive/report.json
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/positive/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
      - name: Prove a stale declaration mapping stops evaluation
        id: stale_mapping
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@473224b714444c1af9b9cf535a79857c46b81318
        with:
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          mapping: test/fixtures/schema-authority-canary/stale.mapping.json
          report: .typespec-json-schema-validator/stale-mapping/report.json
          sarif: .typespec-json-schema-validator/stale-mapping/report.sarif
          contract_ir: .typespec-json-schema-validator/stale-mapping/contract-ir.json
          output_dir: .typespec-json-schema-validator/stale-mapping/generated
          max_probes: "64"
      - name: Verify attributable stale-mapping evidence, tombstone, and immutable authorities
        env:
          STALE_MAPPING_OUTCOME: ${{ steps.stale_mapping.outcome }}
        run: |
          set -euo pipefail
          test "$STALE_MAPPING_OUTCOME" = "failure"
          node test/fixtures/schema-authority-canary/check-stale-mapping-receipt.mjs \
            .typespec-json-schema-validator/stale-mapping/report.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/stale-mapping/report.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/stale-mapping/contract-ir.json", "utf8"));
          assert.equal(report.status, "stopped_for_evaluation");
          assert.equal(ir.status, "stopped_for_evaluation");
          assert.equal(ir.admissible, false);
          assert.deepEqual(ir.declarations, []);
          assert.equal(ir.admission.receipt.runId, report.runId);
          NODE
          git diff --exit-code -- \
            test/fixtures/schema-authority-canary/main.tsp \
            test/fixtures/schema-authority-canary/authored.schema.json \
            test/fixtures/schema-authority-canary/stale.mapping.json
      - name: Retain positive, negative, Contract IR, and generated evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-ir-admission-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
