[package]
org = "fiducia-cloud"
name = "fiducia-lib-core"
version = "0.1.0"
description = "Shared Fiducia client, server, edge, and isomorphic policy and domain library"
keywords = ["configuration", "shared-auth", "opto-sync", "opentelemetry", "rate-limit", "zed-pkg"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-lib-core"

[dependencies]
# resolved with `zed install --frozen`; add entries only when the registry can pin them immutably

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env", ".env.*", "env/**", ".direnv/**", ".vendor/.zed/**", ".zed/**",
  "target/**", "**/target/**", "**/node_modules/**", "**/.dart_tool/**",
  "**/build/**", "tmp/**", "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
test = "cargo test --all-targets --all-features"
