[package]
org = "fiducia-cloud"
name = "fiducia-lib-core"
version = "0.2.0"
description = "Shared Fiducia service policy, configuration, middleware, and rate-limit integration"
keywords = ["configuration", "middleware", "interfaces", "rate-limit", "zed-pkg"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-lib-core"

[dependencies]
"fiducia-cloud/fiducia-interfaces" = "^0.1.0"
"oresoftware/ores-middleware" = "^0.1.0"
"ores-rate-limit/ores-rl-lib-core" = "^0.2.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env", ".env.*", "env/**", ".direnv/**", ".vendor/.zed/**", ".zed/**",
  "target/**", "**/target/**", "**/node_modules/**", "**/.dart_tool/**",
  "**/build/**", "tmp/**", "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
test = "cargo test --all-targets --all-features"
